[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memebot"
version = "0.1.0"
description = "A local, review-first daily meme compilation workbench"
requires-python = ">=3.13,<3.14"
dependencies = [
  "streamlit>=1.45,<2", "yt-dlp[default]>=2025.11.12",
  "scenedetect>=0.7,<0.8", "imagehash>=4.3,<5",
  "pillow>=11,<13", "google-api-python-client>=2.170,<3",
  "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3", "python-dotenv>=1,<2"
]

[project.scripts]
memebot = "memebot.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "responses>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["media: real FFmpeg integration tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/memebot"]
